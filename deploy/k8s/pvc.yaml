apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: weather-timemachine
  namespace: weather
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  # Set to a storage class that exists on your cluster (longhorn, local-path,
  # ebs-sc, etc.). Omit to use the cluster default.
  # storageClassName: longhorn
