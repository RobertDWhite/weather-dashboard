apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: weather

resources:
  - namespace.yaml
  - configmap.yaml
  - pvc.yaml
  - deployment-api.yaml
  - deployment-ui.yaml
  - service-api.yaml
  - service-ui.yaml
  - ingress.yaml

# Pin image tags here. Bump after pushing a new image to your registry.
images:
  - name: ghcr.io/robertdwhite/weather-dashboard-api
    newTag: "latest"
  - name: ghcr.io/robertdwhite/weather-dashboard-ui
    newTag: "latest"
