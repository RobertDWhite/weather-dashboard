apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-api
  namespace: weather
spec:
  replicas: 1
  # PVC is RWO; rolling-update would deadlock on the new pod waiting for a
  # volume the old pod still holds. Recreate kills first then starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: weather-api
  template:
    metadata:
      labels:
        app: weather-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: weather-api
          image: ghcr.io/robertdwhite/weather-dashboard-api
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: WX_CONFIG
              value: /etc/weather-dashboard/config.yaml
          volumeMounts:
            - name: config
              mountPath: /etc/weather-dashboard
              readOnly: true
            - name: timemachine
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: 2000m
              memory: 1Gi
      volumes:
        - name: config
          configMap:
            name: weather-config
        - name: timemachine
          persistentVolumeClaim:
            claimName: weather-timemachine
