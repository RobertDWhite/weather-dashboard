server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Compress on the fly — the JS/CSS bundle is ~870 KB raw / 245 KB gzip.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/json application/xml
               application/rss+xml image/svg+xml font/ttf font/otf;
    gzip_min_length 256;

    # Vite-built assets carry a content hash in the filename. Safe to cache
    # these aggressively at the browser; they're immutable.
    location ^~ /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # Proxied API. Backend already sets Cache-Control on image-proxy
    # responses; pass through. Increase read timeout for the briefing
    # endpoint which can take 30-60s when Ollama cold-starts a model.
    location /api/ {
        proxy_pass http://weather-api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_connect_timeout 5s;
        proxy_buffering off;       # let SSE/streamed responses flow
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # SPA fallback. index.html itself must NOT be aggressively cached or
    # users get stuck on stale bundle pointers after a deploy.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
